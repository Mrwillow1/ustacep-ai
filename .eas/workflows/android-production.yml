name: Android Production AAB

on:
  push:
    branches:
      - main

defaults:
  tools:
    pnpm: 10.26.1

jobs:
  build_android:
    name: Build Android production AAB
    type: build
    params:
      platform: android
      profile: production
    steps:
      - uses: eas/build
        with:
          working_directory: ./artifacts/ustacep-ai
