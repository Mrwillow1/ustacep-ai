name: Android Production AAB

on:
  push:
    branches:
      - main

defaults:
  tools:
    pnpm: 10.14.0

jobs:
  build_android:
    name: Build Android production AAB
    type: build
    params:
      platform: android
      profile: production
    steps:
      - uses: eas/get_credentials_for_build_triggered_by_github_integration
      - uses: eas/build
        with:
          working_directory: .