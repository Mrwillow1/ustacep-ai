openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: analysis
    description: AI assisted work analysis
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analyze:
    post:
      operationId: analyzeWork
      tags: [analysis]
      summary: Analyze a work photo and job details
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeWorkRequest"
      responses:
        "200":
          description: AI analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeWorkResult"
        "400":
          description: Invalid request
        "503":
          description: AI provider unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnalyzeWorkRequest:
      type: object
      properties:
        customerName:
          type: string
        title:
          type: string
        type:
          type: string
        address:
          type: string
        notes:
          type: string
        imageDataUrls:
          type: array
          maxItems: 5
          items:
            type: string
            description: A base64 data URL for an optimized work photo
      required:
        - title
        - type
    AnalyzeWorkResult:
      type: object
      properties:
        workType:
          type: string
        description:
          type: string
        dimensions:
          type: string
        materials:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              quantity:
                type: number
              unit:
                type: string
              estimatedUnitPrice:
                type: number
            required: [name, quantity, unit, estimatedUnitPrice]
        laborHours:
          type: number
        approximateCost:
          type: number
        isApproximate:
          type: boolean
        source:
          type: string
      required:
        - workType
        - description
        - dimensions
        - materials
        - laborHours
        - approximateCost
        - isApproximate
        - source

